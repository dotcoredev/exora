name: Deploy

on:
  push:
    branches:
      - main

  # Позволяет запустить deploy руками из GitHub
  workflow_dispatch:

concurrency:
  group: exora-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

  # При необходимости можно заменить repository_owner
  # на конкретный lowercase GitHub login.
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/exora-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/exora-web

jobs:
  # =========================================================
  # BUILD + PUSH
  # =========================================================
  build:
    name: Build and push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # API
      # -------------------------
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true

          build-args: |
            DATABASE_URI=postgresql://unused:unused@localhost:5432/unused

          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # -------------------------
      # WEB
      # -------------------------
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true

          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nicodes.ru/api

          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web


  # =========================================================
  # DEPLOY VPS
  # =========================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # SSH
      # -------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # -------------------------
      # Prepare directory
      # -------------------------
      - name: Prepare infra directory
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/nicode/infra"

      # -------------------------
      # Copy infrastructure
      # -------------------------
      - name: Upload infrastructure
        run: |
          rsync \
            -az \
            --delete \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/nicode/infra/"

      # -------------------------
      # Deploy
      # -------------------------
      - name: Deploy containers
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          COMPOSE="docker compose \
            --env-file /var/nicode/env/production.env \
            -f /var/nicode/infra/docker-compose.yml"

          echo "Pulling new images..."
          $COMPOSE pull

          echo "Starting database infrastructure..."
          $COMPOSE up -d --wait postgres redis

          echo "Applying Prisma migrations..."
          $COMPOSE run --rm --no-deps api pnpm exec prisma migrate deploy

          echo "Starting Exora..."
          $COMPOSE up -d --remove-orphans --wait

          echo "Removing unused Docker images..."
          docker image prune -f

          echo "Deployment completed."
          EOF