name: Deploy Exora

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: exora-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/dotcoredev/exora-api
  WEB_IMAGE: ghcr.io/dotcoredev/exora-web

jobs:
  # =========================================================
  # CHECK CHANGED FILES
  # =========================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'
            infra:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'

  # =========================================================
  # BUILD (api + web через matrix)
  # =========================================================
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/dotcoredev/exora-api
            dockerfile: ./apps/api/Dockerfile
            changed: ${{ needs.changes.outputs.api }}
            build_args: |
              DIRECT_DATABASE_URI=postgresql://unused:unused@localhost:5432/unused
          - name: web
            image: ghcr.io/dotcoredev/exora-web
            dockerfile: ./apps/web/Dockerfile
            changed: ${{ needs.changes.outputs.web }}
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.nicodes.ru/api

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || matrix.changed == 'true'
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || matrix.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'workflow_dispatch' || matrix.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'workflow_dispatch' || matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # =========================================================
  # DEPLOY VPS
  # =========================================================
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    needs:
      - changes
      - build

    # build со skipped-легами матрицы всё равно даёт result == 'success',
    # поэтому отдельно проверять build-api/build-web не нужно.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.infra == 'true'
      )

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare server directory
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/nicode/infra"

      - name: Upload infrastructure
        run: |
          rsync \
            -az \
            --delete \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/nicode/infra/"

      - name: Deploy containers
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -euo pipefail

          echo "=== Login to GHCR ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

          compose() {
            docker compose \
              --env-file /var/nicode/env/production.env \
              -f /var/nicode/infra/docker-compose.yml \
              "$@"
          }

          # =========================================================
          # INFRA
          # =========================================================

          echo "=== Start PostgreSQL and Redis ==="
          compose up -d --wait postgres pgbouncer redis

          # =========================================================
          # API
          # =========================================================

          if [[ "${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}" == "true" ]]; then
            echo "=== Pull API ==="
            compose pull api

            echo "=== Prisma migrations ==="
            compose run --rm --no-deps -T api \
              ./node_modules/.bin/prisma migrate deploy < /dev/null

            echo "=== Recreate API ==="
            compose up -d --force-recreate --no-deps api
          fi

          # =========================================================
          # WEB
          # =========================================================

          if [[ "${{ needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}" == "true" ]]; then
            echo "=== Pull Web ==="
            compose pull web

            echo "=== Recreate Web ==="
            compose up -d --force-recreate --no-deps web
          fi

          # =========================================================
          # RESUME
          # =========================================================

          echo "=== Pull Resume ==="
          compose pull resume

          echo "=== Recreate Resume ==="
          compose up -d --force-recreate --no-deps resume

          # =========================================================
          # NICODES
          # =========================================================

          echo "=== Pull nicodes.ru ==="
          compose pull nicodes

          echo "=== Recreate nicodes.ru ==="
          compose up -d --force-recreate --no-deps nicodes

          # =========================================================
          # NGINX
          # =========================================================

          echo "=== Ensure Nginx is running ==="
          compose up -d --no-deps nginx

          echo "=== Container status ==="
          compose ps -a

          echo "=== Remove unused images ==="
          docker image prune -f

          echo "=== Deploy completed ==="

          EOF