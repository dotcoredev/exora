name: Deploy Exora

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: exora-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

  API_IMAGE: ghcr.io/dotcoredev/exora-api
  WEB_IMAGE: ghcr.io/dotcoredev/exora-web


jobs:
  # =========================================================
  # CHECK CHANGED FILES
  # =========================================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'

            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.dockerignore'

            infra:
              - 'deploy/**'
              - '.github/workflows/deploy.yml'


  # =========================================================
  # BUILD API
  # =========================================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    needs:
      - changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile

          push: true

          build-args: |
            DATABASE_URI=postgresql://unused:unused@localhost:5432/unused

          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api


  # =========================================================
  # BUILD WEB
  # =========================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    needs:
      - changes

    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile

          push: true

          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nicodes.ru/api

          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web


  # =========================================================
  # DEPLOY VPS
  # =========================================================
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    needs:
      - changes
      - build-api
      - build-web

    # skipped build-api/build-web не должны блокировать deploy.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.infra == 'true'
      ) &&
      (
        needs.build-api.result == 'success' ||
        needs.build-api.result == 'skipped'
      ) &&
      (
        needs.build-web.result == 'success' ||
        needs.build-web.result == 'skipped'
      )

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7


      # -------------------------------------------------------
      # SSH
      # -------------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      # -------------------------------------------------------
      # SERVER DIRECTORIES
      # -------------------------------------------------------
      - name: Prepare server directory
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/nicode/infra"


      # -------------------------------------------------------
      # UPLOAD INFRA
      # -------------------------------------------------------
      - name: Upload infrastructure
        run: |
          rsync \
            -az \
            --delete \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            deploy/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/nicode/infra/"


      # -------------------------------------------------------
      # DEPLOY
      # -------------------------------------------------------
      - name: Deploy containers
        run: |
          ssh \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          COMPOSE="docker compose \
            --env-file /var/nicode/env/production.env \
            -f /var/nicode/infra/docker-compose.yml"

          echo "=== Pull images ==="
          $COMPOSE pull

          echo "=== Start PostgreSQL and Redis ==="
          $COMPOSE up -d postgres redis

          echo "=== Wait for PostgreSQL and Redis ==="
          $COMPOSE up -d --wait postgres redis

          echo "=== Prisma migrations ==="
          $COMPOSE run --rm --no-deps api ./node_modules/.bin/prisma migrate deploy

          echo "=== Prisma seed ==="
          $COMPOSE run --rm --no-deps api node dist/prisma/seed.js

          echo "=== Start API and Web ==="
          $COMPOSE up -d api web

          echo "=== Start Nginx ==="
          $COMPOSE up -d nginx

          echo "=== Container status ==="
          $COMPOSE ps -a

          echo "=== Remove unused images ==="
          docker image prune -f

          echo "=== Deploy completed ==="

          EOF