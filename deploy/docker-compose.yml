services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    #ports:
    #  - "5432:5432"

    volumes:
      - /var/nicode/dbs/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]

    #ports:
    #  - "6379:6379"

    volumes:
      - /var/nicode/dbs/redis:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    image: ghcr.io/dotcoredev/exora-api:latest
    restart: unless-stopped
    env_file:
      - /var/nicode/env/production.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  resume:
    image: ghcr.io/dotcoredev/resume
    restart: unless-stopped

  web:
    image: ghcr.io/dotcoredev/exora-web:latest
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: macbre/nginx-http3:latest
    restart: unless-stopped

    depends_on:
      - web
      - api
      - resume

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      - /var/files:/var/files:ro,Z
      - /var/nicode/certs:/etc/letsencrypt:ro,Z



volumes:
  postgres-data:
  redis-data: