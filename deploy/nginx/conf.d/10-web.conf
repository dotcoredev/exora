# HTTP → HTTPS
server {
    listen 80;
    server_name exora.nicodes.ru;
    # server_name localhost;
    return 301 https://$host$request_uri;
}


server {
    # HTTP/1.1 + HTTP/2
    listen 443 ssl;

    # HTTP/3 / QUIC
    # reuseport указываем только на первом QUIC listener
    listen 443 quic reuseport;

    http2 on;

    server_name exora.nicodes.ru;

    ssl_certificate     /etc/letsencrypt/live/exora.nicodes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exora.nicodes.ru/privkey.pem;

    # Сообщаем браузеру, что HTTP/3 доступен
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    gzip_vary off;
    add_header Vary "Accept-Encoding" always;

    # Удобно потом проверить, действительно ли запрос пришёл через H3
    add_header QUIC-Status $http3 always;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Пусть сжимает именно Nginx,
        # а не Next.js gzip'ом до него.
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Важно для streaming/SSR Next.js
        proxy_buffering off;

        proxy_hide_header X-Powered-By;
    }
}